<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <header class="nav-wrapper">

      <button class="nav-toggle" aria-label="Toggle menu">

  <section id="hero" class="hero">
    <div class="container">
      <div class="hero-grid">
        <div class="hero-photo-wrap">
          <div class="hero-photo-ring">
            <img src="photo.jpg" alt="Judy — Developer Relations" class="hero-photo" />

        </div>
        <div class="hero-text" id="hero-text"></div>
      </div>
    </div>

  <section id="about" class="section">

  <section id="experience" class="section">

  </section>

  <!-- ECOSYSTEM IMPACT -->
  <section id="impact" class="section">
    <div class="container" id="impact-container"></div>
  </section>

  <!-- CURRENTLY LEARNING -->
  <section id="learning" class="section">
    <div class="container" id="learning-container"></div>
  </section>

  <!-- CONTACT -->
  <section id="contact" class="section">
    <div class="container" id="contact-container"></div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container">
      <div class="footer-inner" id="footer-inner"></div>
    </div>
  </footer>

  <script src="content.js"></script>
  <script src="script.js"></script>

</html>
